[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medical-ai-agent-phase1"
version = "0.1.0"
description = "A minimal, teachable medical AI agent built with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.11,<1.0",
]

[project.scripts]
medical-agent = "medical_agent.cli:main"
medical-agent-web = "medical_agent.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
